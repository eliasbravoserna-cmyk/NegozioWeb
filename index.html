<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prodotti Negozio Online</title>
    <!-- Ricordarsi di inserire il link al CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <!-- Inserire qui il contenuto della pagina -->
    <div class="container">
        <table>
            <thead>
                <tr>
                    <th id="thImg">Immagine</th>
                    <th id="thNome">Nome</th>
                    <th id="thPrezzo">Prezzo</th>
                    <th id="thDisp">Disponibilità</th>
                </tr>
            </thead>
            <tbody id="tabellaProdotti"></tbody>
        </table>


        <div class="modal nascosto" id="modale">
            <div class="modal-content">
                <h2 id="prodottoNome"></h2>
                <img src="" alt="" id="prodottoImmagine">
                <p id="prodottoDescrizione"></p>
                <p id="prodottoPrezzo"></p>
                <p id="prodottoDisponibilita"></p>
                <span id="chiudi" class="close">×</span>

            </div>
        </div>
    </div>


    <button id="toggleNasc">Buttone</button>

    <!-- Ricordarsi di inserire il link al JS -->
    <script src="script.js"></script>
</body>

</html>
